name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  arch-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install Node dependencies
        run: npm ci
      - name: Architecture lint
        run: ./scripts/arch-lint.sh

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mmm
          POSTGRES_PASSWORD: mmm
          POSTGRES_DB: mmm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mmm -d mmm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: mmm
      PGPASSWORD: mmm
      PGDATABASE: mmm

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Apply migrations (throwaway DB)
        run: ./scripts/migrate-safe.sh dev

      - name: Tests
        # Test schemas share production database-wide advisory locks.
        run: cargo test --workspace --all-features -- --test-threads=1

      - name: Publication artifact contract
        run: |
          ./scripts/test-historical-source-manifest.sh
          ./scripts/test-gen-research-publication-pins.sh
          ./scripts/gen-research-publication-pins.sh --check --allow-missing-repo
