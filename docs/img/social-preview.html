<!doctype html>
<!-- Render at 1200 x 630, device scale 1, to www/assets/og/og-image.png. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Merge Mining Monitor social preview</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; width: 1200px; height: 630px; background: #000;
      color: #eaf0eb; font-family: Arial, sans-serif; display: flex; align-items: center; }
    .logo { width: 320px; height: 320px; object-fit: contain; margin: 0 54px 0 110px; }
    main { border-left: 1px solid #777; padding: 48px 0 30px 68px; }
    h1 { margin: 0; font-size: 78px; line-height: 1.08; letter-spacing: -2px; }
    h1 span { display: block; color: #ff9f00; }
    .rule { height: 5px; width: 122px; background: #ff9f00; margin: 28px 0 24px; }
    p { margin: 0; font-size: 34px; line-height: 1.35; color: #b5c0b8; }
    .detail { font-size: 24px; color: #8e9b91; margin-top: 12px; }
  </style>
</head>
<body>
  <img class="logo" src="../../www/assets/logo/radar-logo-dark.png" alt="Merge Mining Monitor radar logo">
  <main>
    <h1>Merge Mining<span>Monitor</span></h1>
    <div class="rule"></div>
    <p>Bitcoin mining evidence</p>
    <p class="detail">Attribution, stale and invalid blocks<br>Merge-mined chains and protocol declarations</p>
  </main>
</body>
</html>
